name: Build OffhandQoL

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  XMAKE_COLORTERM: truecolor
  XMAKE_THEME: default
  FORCE_COLOR: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c

      - name: Verify NDK toolchain
        env:
          NDK_PATH: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euxo pipefail
          test -d "$NDK_PATH"
          test -x "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" --version

      - name: Run swap-policy unit tests
        run: |
          set -euxo pipefail
          g++ -std=c++20 -Wall -Wextra -Werror -Isrc \
            tests/swap_policy_test.cpp src/offhand/SwapPolicy.cpp \
            -o /tmp/offhand_swap_policy_test
          /tmp/offhand_swap_policy_test

      - name: Configure, build and package
        env:
          NDK_PATH: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euxo pipefail
          export ANDROID_NDK_ROOT="$NDK_PATH"
          export ANDROID_NDK_HOME="$NDK_PATH"
          xmake f -y -p android -a arm64-v8a -m release \
            --ndk="$NDK_PATH" --ccache=y --policies=build.ccache:y
          xmake -y -v

      - name: Verify outputs
        run: |
          set -euxo pipefail
          OUT="build/android/arm64-v8a/release"
          test -s "$OUT/libOffhandQoL.so"
          test -s "$OUT/OffhandQoL.levipack"
          python3 scripts/verify_native_library.py "$OUT/libOffhandQoL.so"
          python3 scripts/verify_levipack.py "$OUT/OffhandQoL.levipack"
          sha256sum "$OUT/libOffhandQoL.so" "$OUT/OffhandQoL.levipack"

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v7
        with:
          name: OffhandQoL-android-arm64-${{ github.sha }}
          path: |
            build/android/arm64-v8a/release/OffhandQoL.levipack
            build/android/arm64-v8a/release/libOffhandQoL.so
          if-no-files-found: error
          retention-days: 14
